<svg width="220" height="140" viewBox="0 0 220 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sleeping crayfish on a bed</title>
  <desc id="desc">A red crayfish sleeping on a dark bed, matching OpenClaw tone.</desc>
  <defs>
    <linearGradient id="bed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a28"/>
      <stop offset="1" stop-color="#0a0f18"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6666"/>
      <stop offset="1" stop-color="#b72433"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect x="20" y="70" width="180" height="48" rx="12" fill="url(#bed)" stroke="#2b364f" stroke-width="2"/>
  <rect x="32" y="58" width="34" height="18" rx="8" fill="#202b3f" stroke="#2b364f"/>

  <ellipse cx="120" cy="82" rx="56" ry="18" fill="#080c14" opacity="0.45"/>

  <g filter="url(#shadow)">
    <ellipse cx="118" cy="72" rx="34" ry="14" fill="url(#shell)"/>
    <ellipse cx="90" cy="73" rx="13" ry="10" fill="url(#shell)"/>
    <circle cx="83" cy="70" r="2" fill="#201319"/>
    <path d="M75 72c-9 2-14 8-16 14" stroke="#ff7f7f" stroke-width="3" stroke-linecap="round"/>
    <path d="M75 68c-8-3-14-1-18 3" stroke="#ff7f7f" stroke-width="3" stroke-linecap="round"/>
    <path d="M148 69c8-4 18-5 26-2" stroke="#ff8f8f" stroke-width="3" stroke-linecap="round"/>
    <path d="M150 74c8 2 16 8 20 14" stroke="#ff8f8f" stroke-width="3" stroke-linecap="round"/>
    <path d="M96 62q4-6 10 0" stroke="#201319" stroke-width="2" fill="none"/>
  </g>

  <text x="154" y="50" fill="#ff9a9a" font-family="'Satoshi', sans-serif" font-size="14">z z</text>
</svg>
